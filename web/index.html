    <script>
      try {
        var t = localStorage.getItem('chale-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.getElementById('theme-color').content = '#231408';
        }
      } catch (e) {}
    </script>
